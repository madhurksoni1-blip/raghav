
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raghav Rush</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#08121f;
    color:white;
}

/* =====================================================
   LOBBY
   ===================================================== */

#lobby{
    width:100vw;
    height:100vh;
    overflow:auto;
    text-align:center;
    padding:25px;
    background:
    radial-gradient(circle at 50% 10%,#35658f,#101e30 45%,#03070c);
}

.logo{
    font-size:50px;
    font-weight:1000;
    letter-spacing:5px;
    color:#ffd83d;
    text-shadow:0 5px 25px #ff9d00;
}

.sub{
    margin:6px 0 20px;
    color:#a9c5df;
}

.wallet{
    display:inline-block;
    padding:12px 25px;
    border-radius:16px;
    background:#101e30;
    border:2px solid #31577e;
    font-size:20px;
    font-weight:bold;
}

.tabs{
    margin:20px 0;
}

.tab{
    padding:12px 30px;
    margin:4px;
    border:0;
    border-radius:12px;
    background:#19324d;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    background:#ffd83d;
    color:#111;
}

.shop{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:18px;
}

.card{
    padding:18px;
    background:linear-gradient(145deg,#182f48,#091522);
    border:2px solid #294965;
    border-radius:20px;
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#ffd83d;
}

.card.selected{
    border-color:#44ff9d;
    box-shadow:0 0 25px #44ff9d44;
}

.name{
    font-size:21px;
    font-weight:900;
    margin:5px;
}

.stats{
    color:#91acc4;
    font-size:13px;
    line-height:1.7;
}

.price{
    color:#ffd83d;
    font-weight:bold;
    margin:10px;
}

.shopBtn{
    width:100%;
    padding:10px;
    border:0;
    border-radius:12px;
    background:#ffd83d;
    font-weight:900;
    cursor:pointer;
}

.playBtn{
    margin-top:25px;
    padding:17px 75px;
    border:0;
    border-radius:16px;
    background:linear-gradient(90deg,#ffb800,#ffe95a);
    font-size:23px;
    font-weight:1000;
    cursor:pointer;
}

/* =====================================================
   CHARACTER
   ===================================================== */

.avatar{
    width:85px;
    height:140px;
    position:relative;
    margin:5px auto 12px;
}

.head{
    position:absolute;
    width:56px;
    height:56px;
    left:14px;
    top:2px;
    border-radius:50%;
    background:#e7a274;
    z-index:3;
}

.hair{
    position:absolute;
    width:63px;
    height:29px;
    left:10px;
    top:-4px;
    border-radius:40px 40px 15px 15px;
    z-index:5;
}

.eye{
    position:absolute;
    width:6px;
    height:7px;
    background:#111;
    border-radius:50%;
    top:24px;
    z-index:7;
}

.eye.left{left:28px}
.eye.right{left:50px}

.brow{
    position:absolute;
    width:10px;
    height:3px;
    background:#352015;
    top:18px;
    z-index:7;
    border-radius:5px;
}

.brow.left{left:25px}
.brow.right{left:48px}

.nose{
    position:absolute;
    width:4px;
    height:7px;
    background:#c57b53;
    left:41px;
    top:30px;
    border-radius:5px;
    z-index:7;
}

.mouth{
    position:absolute;
    width:16px;
    height:7px;
    left:34px;
    top:39px;
    border-bottom:3px solid #7e2d2d;
    border-radius:0 0 15px 15px;
    z-index:7;
}

.body{
    position:absolute;
    width:44px;
    height:49px;
    left:20px;
    top:53px;
    border-radius:12px;
}

.arm,.leg{
    position:absolute;
    border-radius:12px;
    transform-origin:top center;
    background:#e7a274;
}

.arm{
    width:11px;
    height:40px;
    top:56px;
}

.arm.left{left:8px}
.arm.right{right:8px}

.leg{
    width:13px;
    height:40px;
    top:94px;
}

.leg.left{left:22px}
.leg.right{left:49px}

.shoe{
    position:absolute;
    width:25px;
    height:10px;
    top:128px;
    border-radius:10px;
    background:#111;
}

.shoe.left{left:12px}
.shoe.right{left:46px}

.raghav .hair{background:#111}
.raghav .body{background:#16a085}

.vaibhav .hair{background:#351c0b}
.vaibhav .body{background:#2979ff}

.bhanu .hair{background:#050505}
.bhanu .body{background:#e74c3c}

.itika .hair{
    background:#35104d;
    height:46px;
    border-radius:45px;
}
.itika .body{background:#a855c7}

.naksh .hair{background:#00cfff}
.naksh .body{background:#ffb000}

/* =====================================================
   GAME
   ===================================================== */

#game{
    display:none;
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#79d8ff;
}

/* SKY */

.sky{
    position:absolute;
    inset:0 0 48% 0;
    background:linear-gradient(#55cafa,#d9f8ff);
    transition:background 3s ease;
}

.sun{
    position:absolute;
    width:105px;
    height:105px;
    right:10%;
    top:8%;
    border-radius:50%;
    background:#fff0a0;
    box-shadow:0 0 55px #fff0a0;
}

.moon{
    position:absolute;
    width:82px;
    height:82px;
    right:12%;
    top:9%;
    border-radius:50%;
    background:#eee;
    box-shadow:0 0 35px white;
    opacity:0;
    transition:opacity 3s;
}

/* CLOUDS */

.cloud{
    position:absolute;
    width:150px;
    height:38px;
    border-radius:40px;
    background:white;
    opacity:.75;
    animation:cloudMove 25s linear infinite;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:65px;
    height:65px;
    left:25px;
    top:-30px;
}

.cloud:after{
    width:75px;
    height:75px;
    right:20px;
    top:-38px;
}

@keyframes cloudMove{
    from{transform:translateX(0)}
    to{transform:translateX(-500px)}
}

/* =====================================================
   OLD CITY SILHOUETTE
   ===================================================== */

.city{
    position:absolute;
    z-index:2;
    bottom:47%;
    height:180px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    white-space:nowrap;
    animation:cityMove 20s linear infinite;
}

.building{
    width:90px;
    flex:none;
    background:#46657f;
    border-radius:5px 5px 0 0;
    position:relative;
    overflow:hidden;
}

.building:nth-child(2n){
    background:#304c66;
}

.building:before{
    content:"";
    position:absolute;
    inset:12px 10px;
    background:
      repeating-linear-gradient(
        90deg,
        #ffe58a 0 10px,
        transparent 10px 24px
      ),
      repeating-linear-gradient(
        0deg,
        transparent 0 20px,
        #d8efff 20px 30px,
        transparent 30px 42px
      );
    opacity:.55;
}

@keyframes cityMove{
    from{transform:translateX(0)}
    to{transform:translateX(-450px)}
}

/* =====================================================
   NEW BACKGROUND DECORATION
   ===================================================== */

.bgDecor{
    position:absolute;
    z-index:4;
    left:0;
    right:0;
    bottom:48%;
    height:43%;
    overflow:hidden;
    pointer-events:none;
}

/* BUILDINGS */

.bgBuildings{
    position:absolute;
    left:-5%;
    right:-5%;
    bottom:20px;
    height:82%;
    display:flex;
    align-items:flex-end;
    gap:14px;
    animation:bgMove 34s linear infinite;
}

.bgBuilding{
    position:relative;
    flex:none;
    width:105px;
    height:150px;
    border-radius:5px 5px 0 0;
    background:linear-gradient(135deg,#617d91,#30475b);
    box-shadow:inset -10px 0 0 #263b4c55;
}

.bgBuilding:nth-child(2n){
    width:135px;
    height:205px;
    background:linear-gradient(135deg,#8b6f62,#4e3e43);
}

.bgBuilding:nth-child(3n){
    width:82px;
    height:125px;
    background:linear-gradient(135deg,#557c6d,#304f4a);
}

.bgBuilding:before{
    content:"";
    position:absolute;
    left:14px;
    right:14px;
    top:18px;
    bottom:12px;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0 22px,
        #ffd76a 23px 35px,
        transparent 36px 55px
      ),
      repeating-linear-gradient(
        0deg,
        transparent 0 25px,
        #d9efff 26px 38px,
        transparent 39px 55px
      );
    opacity:.8;
}

.bgBuilding:after{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:30px;
    height:58px;
    border-radius:8px 8px 0 0;
    background:#202d38;
}

/* TREES */

.bgTrees{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:20px;
    height:45%;
    display:flex;
    align-items:flex-end;
    justify-content:space-around;
    animation:bgMoveSlow 46s linear infinite;
}

.bgTree{
    position:relative;
    width:42px;
    height:100px;
}

.bgTree:before{
    content:"";
    position:absolute;
    left:18px;
    bottom:0;
    width:8px;
    height:58px;
    background:#65452f;
    border-radius:5px;
}

.bgTree:after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:45px;
    height:52px;
    border-radius:50%;
    background:#26734d;
    box-shadow:
        20px 12px 0 #318458,
        -12px 18px 0 #3b9360;
}

/* STREET LIGHTS */

.streetLight{
    position:absolute;
    bottom:18px;
    width:8px;
    height:145px;
    background:#202b33;
    border-radius:6px;
}

.streetLight:before{
    content:"";
    position:absolute;
    top:-8px;
    left:-22px;
    width:52px;
    height:10px;
    border-radius:10px;
    background:#202b33;
}

.streetLight:after{
    content:"";
    position:absolute;
    top:-20px;
    left:10px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#fff3a0;
    box-shadow:0 0 22px #fff3a0;
}

/* BACKGROUND PEOPLE */

.bgPeople{
    position:absolute;
    left:-5%;
    right:-5%;
    bottom:21px;
    height:42%;
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    animation:bgMove 38s linear infinite;
}

.bgPerson{
    position:relative;
    width:34px;
    height:75px;
    opacity:.72;
}

.bgPerson .pHead{
    position:absolute;
    width:20px;
    height:20px;
    left:7px;
    top:0;
    border-radius:50%;
    background:#c98762;
}

.bgPerson .pBody{
    position:absolute;
    width:25px;
    height:34px;
    left:4px;
    top:19px;
    border-radius:9px 9px 5px 5px;
    background:#304c75;
}

.bgPerson .pLeg{
    position:absolute;
    width:7px;
    height:25px;
    top:49px;
    background:#222a31;
    border-radius:5px;
}

.bgPerson .pLeg.one{left:7px}
.bgPerson .pLeg.two{right:7px}

/* BAGS */

.bgBag{
    position:absolute;
    bottom:20px;
    width:30px;
    height:25px;
    border-radius:6px 6px 9px 9px;
    background:#b85a35;
    box-shadow:inset 0 5px 0 #d77a4d;
    opacity:.8;
}

.bgBag:before{
    content:"";
    position:absolute;
    width:12px;
    height:8px;
    left:9px;
    top:-7px;
    border:3px solid #8b462e;
    border-bottom:0;
    border-radius:8px 8px 0 0;
}

/* CITY SIGNS */

.bgSign{
    position:absolute;
    bottom:25px;
    width:105px;
    height:48px;
    border:4px solid #202a31;
    border-radius:8px;
    background:linear-gradient(90deg,#f7c948,#ff8c42);
    color:#17212b;
    font-size:13px;
    font-weight:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:1px;
}

/* SMALL STREET STRIP */

.bgStreet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:26px;
    background:linear-gradient(#69747d,#46515a);
    border-top:3px solid #aab3b8;
}

@keyframes bgMove{
    from{transform:translateX(0)}
    to{transform:translateX(-700px)}
}

@keyframes bgMoveSlow{
    from{transform:translateX(0)}
    to{transform:translateX(-500px)}
}

/* =====================================================
   ROAD
   ===================================================== */

.road{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:48%;
    z-index:10;
    background:linear-gradient(#3b4148,#20242a);
    border-top:7px solid #888;
}

/* CENTER ROAD LINE */

.roadLine{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:8px;

    background:repeating-linear-gradient(
        90deg,
        white 0 80px,
        transparent 80px 150px
    );

    animation:roadMove .55s linear infinite;
}

@keyframes roadMove{
    from{transform:translateX(0)}
    to{transform:translateX(-150px)}
}

/* ROAD EDGE */

.road:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:15px;
    height:8px;
    background:#ffd83d;
}

/* =====================================================
   PLAYER
   ===================================================== */

#player{
    position:absolute;
    z-index:30;
    width:85px;
    height:145px;
    left:120px;
    bottom:25%;
    will-change:transform;
}

#player .avatar{
    margin:0;
}

/* RUNNING */

.running .leg.left{
    animation:legLeft .20s infinite alternate ease-in-out;
}

.running .leg.right{
    animation:legRight .20s infinite alternate ease-in-out;
}

.running .arm.left{
    animation:armLeft .20s infinite alternate ease-in-out;
}

.running .arm.right{
    animation:armRight .20s infinite alternate ease-in-out;
}

@keyframes legLeft{
    from{transform:rotate(28deg)}
    to{transform:rotate(-28deg)}
}

@keyframes legRight{
    from{transform:rotate(-28deg)}
    to{transform:rotate(28deg)}
}

@keyframes armLeft{
    from{transform:rotate(-25deg)}
    to{transform:rotate(25deg)}
}

@keyframes armRight{
    from{transform:rotate(25deg)}
    to{transform:rotate(-25deg)}
}

/* =====================================================
   CENTER COINS
   ===================================================== */

.coin{
    position:absolute;
    z-index:20;
    width:32px;
    height:32px;
    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #fffbc0 0 15%,
        #ffe000 40%,
        #d88d00 100%
    );

    border:3px solid #fff4a0;
    box-shadow:0 0 18px #ffd000;
    will-change:transform;
}

.coin:after{
    content:"$";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9b6200;
    font-weight:1000;
}

/* =====================================================
   ONE OBSTACLE ONLY
   ===================================================== */

.obstacle{
    position:absolute;
    z-index:25;
    width:72px;
    height:70px;
    bottom:25%;

    background:
    linear-gradient(
        135deg,
        #ff5b4d,
        #a51912
    );

    border:4px solid #ffb9ad;
    border-radius:9px;

    box-shadow:
        0 8px 20px #0008;

    will-change:transform;
}

.obstacle:before{
    content:"⚠";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:1000;
    color:white;
}

.obstacle:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:7px;
    height:8px;

    background:
    repeating-linear-gradient(
        135deg,
        #ffd83d 0 12px,
        #222 12px 24px
    );
}

/* =====================================================
   JUMP ARROW
   ===================================================== */

#jumpButton{
    position:absolute;
    z-index:80;
    right:35px;
    bottom:30px;
    width:75px;
    height:75px;
    border-radius:50%;
    border:4px solid white;

    background:
    linear-gradient(
        145deg,
        #ffc400,
        #ff7b00
    );

    color:white;
    font-size:42px;
    font-weight:1000;
    cursor:pointer;

    box-shadow:
        0 0 25px #ffae00,
        0 7px 0 #9b5000;

    transition:.12s;
}

#jumpButton:active{
    transform:translateY(6px);
    box-shadow:0 0 10px #ffae00;
}

.jumpHint{
    position:absolute;
    z-index:80;
    right:28px;
    bottom:110px;
    background:#07111ddd;
    padding:7px 12px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

/* =====================================================
   HUD
   ===================================================== */

.hud{
    position:absolute;
    z-index:70;
    left:18px;
    right:18px;
    top:15px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hudBox{
    background:#07111ddd;
    border:1px solid #ffffff33;
    padding:10px 17px;
    border-radius:14px;
    font-weight:bold;
}

/* =====================================================
   GAME OVER
   ===================================================== */

#gameOver{
    display:none;
    position:absolute;
    z-index:100;
    inset:0;
    background:#0009;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.overBox{
    background:#101d2d;
    border:2px solid #365777;
    padding:35px;
    border-radius:25px;
}

.overBox h1{
    color:#ffd83d;
    font-size:50px;
}

.overBtn{
    margin-top:18px;
    padding:12px 25px;
    border:0;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:700px){

    .logo{
        font-size:32px;
    }

    .hudBox{
        font-size:10px;
        padding:7px;
    }

    .shop{
        grid-template-columns:repeat(2,1fr);
    }

    #jumpButton{
        width:68px;
        height:68px;
        right:20px;
        bottom:20px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     LOBBY
     ===================================================== -->

<div id="lobby">

    <div class="logo">RAGHAV RUSH</div>

    <div class="sub">
        RUN • JUMP • COLLECT • UPGRADE
    </div>

    <div class="wallet">
        🪙 <span id="wallet">0</span> Coins
    </div>

    <div class="tabs">

        <button
        class="tab active"
        onclick="showCharacters()">
            CHARACTERS
        </button>

        <button
        class="tab"
        onclick="showPowers()">
            POWERS
        </button>

    </div>

    <div id="characters" class="shop"></div>

    <div
    id="powers"
    class="shop"
    style="display:none">
    </div>

    <button
    class="playBtn"
    onclick="startGame()">
        ▶ PLAY
    </button>

</div>


<!-- =====================================================
     GAME
     ===================================================== -->

<div id="game">

    <div class="sky"></div>

    <div class="sun"></div>

    <div class="moon"></div>

    <div
    class="cloud"
    style="left:10%;top:14%">
    </div>

    <div
    class="cloud"
    style="left:55%;top:20%">
    </div>

    <div class="city" id="city"></div>

    <!-- BACKGROUND DECORATION ONLY -->
    <div class="bgDecor">

        <div class="bgBuildings">

            <div class="bgBuilding"></div>
            <div class="bgBuilding"></div>
            <div class="bgBuilding"></div>
            <div class="bgBuilding"></div>
            <div class="bgBuilding"></div>
            <div class="bgBuilding"></div>
            <div class="bgBuilding"></div>
            <div class="bgBuilding"></div>
            <div class="bgBuilding"></div>
            <div class="bgBuilding"></div>

        </div>

        <div class="bgTrees">

            <div class="bgTree"></div>
            <div class="bgTree"></div>
            <div class="bgTree"></div>
            <div class="bgTree"></div>
            <div class="bgTree"></div>
            <div class="bgTree"></div>

        </div>

        <div class="streetLight" style="left:8%"></div>
        <div class="streetLight" style="left:32%"></div>
        <div class="streetLight" style="left:58%"></div>
        <div class="streetLight" style="left:84%"></div>

        <div class="bgPeople">

            <div class="bgPerson">
                <div class="pHead"></div>
                <div class="pBody"></div>
                <div class="pLeg one"></div>
                <div class="pLeg two"></div>
            </div>

            <div class="bgPerson">
                <div class="pHead"></div>
                <div class="pBody"></div>
                <div class="pLeg one"></div>
                <div class="pLeg two"></div>
            </div>

            <div class="bgPerson">
                <div class="pHead"></div>
                <div class="pBody"></div>
                <div class="pLeg one"></div>
                <div class="pLeg two"></div>
            </div>

            <div class="bgPerson">
                <div class="pHead"></div>
                <div class="pBody"></div>
                <div class="pLeg one"></div>
                <div class="pLeg two"></div>
            </div>

            <div class="bgPerson">
                <div class="pHead"></div>
                <div class="pBody"></div>
                <div class="pLeg one"></div>
                <div class="pLeg two"></div>
            </div>

        </div>

        <div class="bgBag" style="left:18%"></div>
        <div class="bgBag" style="left:47%"></div>
        <div class="bgBag" style="left:76%"></div>

        <div class="bgSign" style="left:23%">
            RAGHAV CITY
        </div>

        <div class="bgSign" style="left:67%">
            METRO
        </div>

        <div class="bgStreet"></div>

    </div>


    <div class="road">
        <div class="roadLine"></div>
    </div>


    <!-- HUD -->

    <div class="hud">

        <div class="hudBox">
            🏆 Score:
            <span id="score">0</span>
        </div>

        <div class="hudBox">
            🌤️
            <span id="weatherText">
                Sunny
            </span>
        </div>

        <div class="hudBox">
            🪙
            <span id="gameCoins">0</span>
        </div>

        <div class="hudBox">
            ⚡
            <span id="speedText">1</span>
        </div>

    </div>


    <!-- PLAYER -->

    <div id="player">

        <div class="avatar">

            <div class="head"></div>
            <div class="hair"></div>

            <div class="brow left"></div>
            <div class="brow right"></div>

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="nose"></div>
            <div class="mouth"></div>

            <div class="body"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

            <div class="shoe left"></div>
            <div class="shoe right"></div>

        </div>

    </div>


    <!-- JUMP BUTTON -->

    <div class="jumpHint">
        JUMP
    </div>

    <button
    id="jumpButton"
    onclick="jump()">
        ↑
    </button>


    <!-- GAME OVER -->

    <div id="gameOver">

        <div class="overBox">

            <h1>GAME OVER</h1>

            <p style="margin-top:10px">
                Score:
                <b id="finalScore">0</b>
            </p>

            <p>
                Coins:
                <b id="finalCoins">0</b>
            </p>

            <button
            class="overBtn"
            onclick="startGame()">
                🔄 PLAY AGAIN
            </button>

            <button
            class="overBtn"
            onclick="backLobby()">
                🏠 LOBBY
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SAVE
   ===================================================== */

let save =
JSON.parse(
    localStorage.getItem("raghavRushSave")
) ||
{
    coins:0,
    selected:0,
    owned:[0],
    powers:[]
};

function saveGame(){

    localStorage.setItem(
        "raghavRushSave",
        JSON.stringify(save)
    );

    document.getElementById("wallet")
        .textContent=save.coins;
}


/* =====================================================
   CHARACTERS
   ===================================================== */

const characters=[

{
    name:"Raghav",
    price:0,
    cls:"raghav",
    speed:1,
    bonus:1,
    quality:"STARTER"
},

{
    name:"Vaibhav",
    price:1000,
    cls:"vaibhav",
    speed:1.08,
    bonus:1.10,
    quality:"FAST"
},

{
    name:"Bhanu",
    price:2500,
    cls:"bhanu",
    speed:1.15,
    bonus:1.20,
    quality:"POWER"
},

{
    name:"Itika",
    price:5000,
    cls:"itika",
    speed:1.23,
    bonus:1.35,
    quality:"ELITE"
},

{
    name:"Naksh",
    price:10000,
    cls:"naksh",
    speed:1.30,
    bonus:1.50,
    quality:"LEGENDARY"
}

];


/* =====================================================
   CHARACTER HTML
   ===================================================== */

function characterAvatar(c){

return `

<div class="avatar ${c.cls}">

    <div class="head"></div>
    <div class="hair"></div>

    <div class="brow left"></div>
    <div class="brow right"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="nose"></div>
    <div class="mouth"></div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

    <div class="shoe left"></div>
    <div class="shoe right"></div>

</div>

`;
}


function renderCharacters(){

    document.getElementById("characters")
    .innerHTML=

    characters.map((c,i)=>{

        const owned=
            save.owned.includes(i);

        const selected=
            save.selected===i;

        return `

        <div
        class="card ${selected?"selected":""}">

            ${characterAvatar(c)}

            <div class="name">
                ${c.name}
            </div>

            <div class="stats">

                ${c.quality}<br>

                ⚡ Speed ×${c.speed}<br>

                🪙 Coin Bonus ×${c.bonus}

            </div>

            <div class="price">

                ${
                    c.price===0
                    ?"FREE"
                    :"🪙 "+c.price
                }

            </div>

            <button
            class="shopBtn"
            onclick="buyCharacter(${i})">

                ${
                    selected
                    ?"✓ SELECTED"
                    :owned
                    ?"SELECT"
                    :"BUY"
                }

            </button>

        </div>

        `;

    }).join("");

    saveGame();
}


function buyCharacter(i){

    if(save.owned.includes(i)){

        save.selected=i;

        saveGame();
        renderCharacters();

        return;
    }

    if(save.coins<characters[i].price){

        alert("Coins kam hain!");
        return;
    }

    save.coins -=
        characters[i].price;

    save.owned.push(i);

    save.selected=i;

    saveGame();
    renderCharacters();
}


/* =====================================================
   POWERS
   ===================================================== */

const powers=[

{
    name:"Magnet",
    icon:"🧲",
    price:1000,
    desc:"Coins move toward you"
},

{
    name:"Shield",
    icon:"🛡️",
    price:2000,
    desc:"Blocks one obstacle hit"
},

{
    name:"Coin Boost",
    icon:"💰",
    price:3000,
    desc:"2X coins"
},

{
    name:"Score Boost",
    icon:"⚡",
    price:4000,
    desc:"Extra score"
}

];


function renderPowers(){

    document.getElementById("powers")
    .innerHTML=

    powers.map((p,i)=>{

        const owned=
            save.powers.includes(i);

        return `

        <div class="card">

            <div style="font-size:65px">
                ${p.icon}
            </div>

            <div class="name">
                ${p.name}
            </div>

            <div class="stats">
                ${p.desc}
            </div>

            <div class="price">
                🪙 ${p.price}
            </div>

            <button
            class="shopBtn"
            onclick="buyPower(${i})">

                ${owned?"✓ OWNED":"BUY"}

            </button>

        </div>

        `;

    }).join("");
}


function buyPower(i){

    if(save.powers.includes(i)){

        alert("Power already owned!");
        return;
    }

    if(save.coins<powers[i].price){

        alert("Coins kam hain!");
        return;
    }

    save.coins -= powers[i].price;

    save.powers.push(i);

    saveGame();
    renderPowers();
}


/* =====================================================
   TABS
   ===================================================== */

function showCharacters(){

    document.getElementById("characters")
        .style.display="grid";

    document.getElementById("powers")
        .style.display="none";

    document.querySelectorAll(".tab")[0]
        .classList.add("active");

    document.querySelectorAll(".tab")[1]
        .classList.remove("active");
}


function showPowers(){

    document.getElementById("characters")
        .style.display="none";

    document.getElementById("powers")
        .style.display="grid";

    document.querySelectorAll(".tab")[0]
        .classList.remove("active");

    document.querySelectorAll(".tab")[1]
        .classList.add("active");
}


/* =====================================================
   CITY
   ===================================================== */

function createCity(){

    const city=
        document.getElementById("city");

    city.innerHTML="";

    for(let i=0;i<40;i++){

        const building=
            document.createElement("div");

        building.className="building";

        building.style.height=
            (70+Math.random()*130)+"px";

        city.appendChild(building);
    }
}


/* =====================================================
   GAME VARIABLES
   ===================================================== */

let running=false;

let score=0;
let coins=0;

let worldSpeed=420;

let playerX=120;
let targetX=120;

let playerY=0;
let velocityY=0;

const gravity=1900;
const jumpPower=780;

let lastTime=0;
let spawnTimer=0;

let distance=0;


/* =====================================================
   START
   ===================================================== */

function startGame(){

    document.getElementById("lobby")
        .style.display="none";

    document.getElementById("game")
        .style.display="block";

    document.getElementById("gameOver")
        .style.display="none";

    document.querySelectorAll(
        ".coin,.obstacle"
    ).forEach(e=>e.remove());

    score=0;
    coins=0;

    distance=0;

    worldSpeed=
        420*characters[save.selected].speed;

    playerX=120;
    targetX=120;

    playerY=0;
    velocityY=0;

    spawnTimer=0;

    lastTime=performance.now();

    const player=
        document.getElementById("player");

    player.className="";

    player.classList.add(
        characters[save.selected].cls,
        "running"
    );

    updatePlayer();

    running=true;

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   MOVEMENT
   ===================================================== */

function moveRight(){

    if(!running)return;

    targetX+=110;

    if(targetX>
       window.innerWidth-160){

        targetX=
            window.innerWidth-160;
    }
}


function moveLeft(){

    if(!running)return;

    targetX-=110;

    if(targetX<30){
        targetX=30;
    }
}


function jump(){

    if(!running)return;

    if(playerY<=1){

        velocityY=
            jumpPower;
    }
}


function updatePlayer(){

    document.getElementById("player")
    .style.transform=

    `translate3d(
        ${playerX}px,
        ${-playerY}px,
        0
    )`;
}


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
"keydown",
function(e){

    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    ){
        moveRight();
    }

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    ){
        moveLeft();
    }

    if(
        e.key==="ArrowUp" ||
        e.key.toLowerCase()==="w" ||
        e.code==="Space"
    ){

        e.preventDefault();

        jump();
    }

});


/* =====================================================
   TOUCH
   ===================================================== */

let touchX=0;
let touchY=0;

document.addEventListener(
"touchstart",
e=>{

    touchX=
        e.touches[0].clientX;

    touchY=
        e.touches[0].clientY;

},
{passive:true}
);

document.addEventListener(
"touchend",
e=>{

    const x=
        e.changedTouches[0].clientX;

    const y=
        e.changedTouches[0].clientY;

    const dx=x-touchX;
    const dy=y-touchY;

    if(Math.abs(dx)>Math.abs(dy)){

        if(dx>30)
            moveRight();

        if(dx<-30)
            moveLeft();

    }else if(dy<-30){

        jump();
    }

},
{passive:true}
);


/* =====================================================
   CENTER COIN
   ===================================================== */

function spawnCoin(){

    const c=
        document.createElement("div");

    c.className="coin";

    c.dataset.x=
        window.innerWidth+50;

    /*
       Coin हमेशा road के center line
       के आसपास spawn होगा.
    */

    c.dataset.y=
        window.innerHeight*0.69;

    document.getElementById("game")
        .appendChild(c);
}


/* =====================================================
   OBSTACLE
   ===================================================== */

function spawnObstacle(){

    const o=
        document.createElement("div");

    o.className="obstacle";

    /*
       Same center road position.
       Enough distance between obstacles.
    */

    o.dataset.x=
        window.innerWidth+120;

    document.getElementById("game")
        .appendChild(o);
}


/* =====================================================
   COLLISION
   ===================================================== */

function collision(a,b){

    const r1=
        a.getBoundingClientRect();

    const r2=
        b.getBoundingClientRect();

    return !(
        r1.right<r2.left ||
        r1.left>r2.right ||
        r1.bottom<r2.top ||
        r1.top>r2.bottom
    );
}


/* =====================================================
   WEATHER
   ===================================================== */

const weather=[

{
    name:"Sunny",
    sky:"linear-gradient(#55cafa,#d9f8ff)",
    sun:true,
    moon:false
},

{
    name:"Sunset",
    sky:"linear-gradient(#ff874b,#e64c72,#46336b)",
    sun:true,
    moon:false
},

{
    name:"Night",
    sky:"linear-gradient(#08152d,#18284e)",
    sun:false,
    moon:true
}

];


function updateWeather(){

    const index=
        Math.floor(distance/12000)
        %weather.length;

    const w=weather[index];

    document.querySelector(".sky")
        .style.background=w.sky;

    document.getElementById("weatherText")
        .textContent=w.name;

    document.querySelector(".sun")
        .style.opacity=
        w.sun?"1":"0";

    document.querySelector(".moon")
        .style.opacity=
        w.moon?"1":"0";
}


/* =====================================================
   GAME LOOP
   ===================================================== */

function gameLoop(now){

    if(!running)return;

    const dt=
        Math.min(
            (now-lastTime)/1000,
            .033
        );

    lastTime=now;

    /* Distance */

    distance+=
        worldSpeed*dt;


    /* SMOOTH HORIZONTAL MOVEMENT */

    const difference=
        targetX-playerX;

    playerX +=
        difference*
        Math.min(
            1,
            dt*9
        );


    /* JUMP PHYSICS */

    playerY +=
        velocityY*dt;

    velocityY -=
        gravity*dt;

    if(playerY<=0){

        playerY=0;
        velocityY=0;
    }

    updatePlayer();


    /* SCORE */

    score+=
        dt*60;

    let scoreValue=
        Math.floor(score);

    if(save.powers.includes(3)){

        scoreValue=
            Math.floor(score*1.5);
    }

    document.getElementById("score")
        .textContent=scoreValue;


    /* SPEED */

    worldSpeed +=
        dt*2.2;

    document.getElementById("speedText")
        .textContent=
        Math.floor(worldSpeed/100);


    /* SPAWN */

    spawnTimer+=dt;

    const gap=
        Math.max(
            1.35,
            1.8-worldSpeed/5000
        );

    if(spawnTimer>gap){

        spawnTimer=0;

        spawnCoin();

        if(Math.random()<0.65){

            setTimeout(
                ()=>{
                    if(running)
                        spawnObstacle();
                },
                450
            );
        }
    }


    /* COINS */

    document.querySelectorAll(".coin")
    .forEach(c=>{

        let x=
            parseFloat(c.dataset.x);

        x -=
            worldSpeed*dt;


        /* MAGNET */

        if(save.powers.includes(0)){

            const playerRect=
                document
                .getElementById("player")
                .getBoundingClientRect();

            const coinRect=
                c.getBoundingClientRect();

            const dx=
                playerRect.left-
                coinRect.left;

            if(Math.abs(dx)<260){

                x +=
                    dx*dt*3.5;
            }
        }

        c.dataset.x=x;

        c.style.transform=
            `translate3d(
                ${x}px,
                ${c.dataset.y}px,
                0
            ) rotate(${distance}deg)`;


        /* COLLECT */

        if(
            collision(
                document.getElementById("player"),
                c
            )
        ){

            let multiplier=
                characters[
                    save.selected
                ].bonus;

            if(save.powers.includes(2))
                multiplier*=2;

            coins+=multiplier;

            save.coins+=
                Math.ceil(multiplier);

            c.remove();

            document.getElementById(
                "gameCoins"
            ).textContent=
                Math.floor(coins);

            saveGame();
        }


        if(x<-100)
            c.remove();

    });


    /* OBSTACLES */

    document.querySelectorAll(".obstacle")
    .forEach(o=>{

        let x=
            parseFloat(o.dataset.x);

        x -=
            worldSpeed*dt;

        o.dataset.x=x;

        o.style.transform=
            `translate3d(${x}px,0,0)`;


        /*
           Collision only when player is
           actually near the ground.
           Jumping clears the obstacle.
        */

        if(
            playerY<75 &&
            collision(
                document.getElementById("player"),
                o
            )
        ){

            if(save.powers.includes(1)){

                save.powers=
                    save.powers.filter(
                        x=>x!==1
                    );

                o.remove();

                saveGame();

            }else{

                endGame();
            }
        }


        if(x<-150)
            o.remove();

    });


    updateWeather();

    requestAnimationFrame(gameLoop);
}


/* =====================================================
   GAME OVER
   ===================================================== */

function endGame(){

    if(!running)return;

    running=false;

    document.getElementById("player")
        .classList.remove("running");

    document.getElementById("finalScore")
        .textContent=
        Math.floor(score);

    document.getElementById("finalCoins")
        .textContent=
        Math.floor(coins);

    document.getElementById("gameOver")
        .style.display="flex";
}


/* =====================================================
   BACK LOBBY
   ===================================================== */

function backLobby(){

    running=false;

    document.getElementById("game")
        .style.display="none";

    document.getElementById("lobby")
        .style.display="block";

    document.querySelectorAll(
        ".coin,.obstacle"
    ).forEach(e=>e.remove());

    renderCharacters();
    renderPowers();
}


/* =====================================================
   INIT
   ===================================================== */

createCity();

renderCharacters();

renderPowers();

saveGame();

</script>

</body>
</html>
